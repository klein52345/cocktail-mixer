<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍸 Алхимия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0b12;
            color: #e8e6e3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0b0b12 70%);
            padding: 16px;
            user-select: none;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* === ЗАГОЛОВОК === */
        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header .sub {
            font-size: 12px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* === КОЛБА === */
        .flask-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0 30px 0;
            min-height: 260px;
        }
        .flask {
            width: 140px;
            height: 200px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-top: none;
            border-radius: 0 0 70px 70px;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.05);
            transition: border-color 0.3s;
            flex-shrink: 0;
        }
        .flask-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1), background 0.8s ease;
            height: 0%;
            border-radius: 0 0 68px 68px;
        }
        .flask-liquid::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 0;
            width: 100%;
            height: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 100%);
            border-radius: 50%;
            filter: blur(3px);
        }
        .flask-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            font-weight: 300;
            letter-spacing: 0.5px;
            transition: opacity 0.4s;
        }
        .flask-glow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 50%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.06) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
        }
        .flask-glow.active {
            opacity: 1;
        }

        /* === ИНГРЕДИЕНТЫ (кнопки вокруг) === */
        .ingredient-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 13px;
            color: #d0ccc8;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 0.3px;
            min-width: 60px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }
        .ingredient-btn:active {
            transform: scale(0.94);
        }
        .ingredient-btn.illegal {
            border-color: rgba(255, 60, 60, 0.2);
            color: #ff8888;
        }
        .ingredient-btn.illegal:active {
            background: rgba(255, 60, 60, 0.1);
        }
        .ingredient-btn:active:not(.illegal) {
            background: rgba(255, 215, 0, 0.08);
        }

        /* Расположение кнопок вокруг колбы */
        .btn-left {
            position: absolute;
            left: -10px;
            transform: translateX(-100%);
        }
        .btn-right {
            position: absolute;
            right: -10px;
            transform: translateX(100%);
        }
        .btn-top {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .btn-bottom {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .btn-left-1 {
            top: 10%;
        }
        .btn-left-2 {
            top: 30%;
        }
        .btn-left-3 {
            top: 50%;
        }
        .btn-left-4 {
            top: 70%;
        }
        .btn-right-1 {
            top: 20%;
        }
        .btn-right-2 {
            top: 40%;
        }
        .btn-right-3 {
            top: 60%;
        }
        .btn-right-4 {
            top: 80%;
        }

        /* === КНОПКИ УПРАВЛЕНИЯ === */
        .action-btn {
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            min-width: 120px;
        }
        .action-btn:active {
            transform: scale(0.94);
        }

        .btn-mix {
            background: linear-gradient(135deg, #f9d976, #e6b422);
            color: #0b0b12;
            box-shadow: 0 4px 24px rgba(255, 215, 0, 0.2);
        }
        .btn-mix:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .btn-drink {
            background: linear-gradient(135deg, #ff6b6b, #e63946);
            color: #fff;
            box-shadow: 0 4px 24px rgba(255, 60, 60, 0.2);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        /* === АНИМАЦИЯ ВСТРЯХИВАНИЯ === */
        @keyframes shake {
            0% {
                transform: rotate(0deg);
            }
            15% {
                transform: rotate(-12deg) scale(1.02);
            }
            30% {
                transform: rotate(12deg) scale(1.02);
            }
            45% {
                transform: rotate(-10deg);
            }
            60% {
                transform: rotate(10deg);
            }
            80% {
                transform: rotate(-4deg);
            }
            100% {
                transform: rotate(0deg);
            }
        }
        .flask.shaking {
            animation: shake 0.4s ease-in-out 8;
            transform-origin: center bottom;
            border-color: rgba(255, 215, 0, 0.6);
        }
        .flask.shaking .flask-liquid {
            transition: none;
        }

        /* === РЕЗУЛЬТАТ === */
        #result {
            margin-top: 16px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
            min-height: 50px;
        }
        #result .good {
            color: #7ddf9a;
        }
        #result .warning {
            color: #f1c40f;
        }
        #result .danger {
            color: #ff6b6b;
        }

        .hidden {
            display: none !important;
        }

        .note {
            font-size: 10px;
            color: #4a4a5a;
            margin-top: 10px;
        }

        /* === АДАПТИВ === */
        @media (max-width: 460px) {
            .flask {
                width: 110px;
                height: 160px;
            }
            .ingredient-btn {
                font-size: 11px;
                padding: 6px 12px;
                min-width: 44px;
            }
            .btn-left {
                left: -2px;
                transform: translateX(-90%);
            }
            .btn-right {
                right: -2px;
                transform: translateX(90%);
            }
            .action-btn {
                padding: 12px 20px;
                font-size: 15px;
                min-width: 90px;
            }
        }
        @media (max-width: 380px) {
            .ingredient-btn {
                font-size: 10px;
                padding: 4px 10px;
                min-width: 36px;
            }
            .flask {
                width: 90px;
                height: 130px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">

        <div class="header">
            <h1>✦ Алхимия</h1>
            <div class="sub">лаборатория коктейлей</div>
        </div>

        <!-- КОЛБА С КНОПКАМИ -->
        <div class="flask-wrapper" id="flaskWrapper">

            <!-- Кнопки слева -->
            <button class="ingredient-btn btn-left btn-left-1" data-ingredient="Текила">🌵 Текила</button>
            <button class="ingredient-btn btn-left btn-left-2" data-ingredient="Ром">🏝️ Ром</button>
            <button class="ingredient-btn btn-left btn-left-3" data-ingredient="Водка">❄️ Водка</button>
            <button class="ingredient-btn btn-left btn-left-4" data-ingredient="Джин">🌿 Джин</button>

            <!-- Кнопки справа -->
            <button class="ingredient-btn btn-right btn-right-1" data-ingredient="Абсент">🧪 Абсент</button>
            <button class="ingredient-btn btn-right btn-right-2" data-ingredient="Ликер Блю Кюрасао">💎 Блю</button>
            <button class="ingredient-btn btn-right btn-right-3" data-ingredient="Кока-Кола">🥤 Кола</button>
            <button class="ingredient-btn btn-right btn-right-4" data-ingredient="Сок Лайма">🍋 Лайм</button>

            <!-- Кнопки сверху и снизу -->
            <button class="ingredient-btn btn-top" data-ingredient="Энергетик">⚡ Энергетик</button>
            <button class="ingredient-btn btn-bottom" data-ingredient="Сироп Гренадин">🍒 Гренадин</button>

            <!-- Нелегальные (внизу слева/справа) -->
            <button class="ingredient-btn btn-left btn-left-2 illegal" data-ingredient="Кетамин" style="top:90%;">💉 Кетамин</button>
            <button class="ingredient-btn btn-right btn-right-2 illegal" data-ingredient="МДМА" style="top:90%;">💎 МДМА</button>

            <!-- Сама колба -->
            <div class="flask" id="flask">
                <div class="flask-liquid" id="liquid" style="height:0%; background:#f1c40f;"></div>
                <div class="flask-glow" id="flaskGlow"></div>
                <div class="flask-label" id="flaskLabel">наливай</div>
            </div>
        </div>

        <!-- ИНФО О НАЛИТОМ -->
        <div id="pourInfo" style="font-size:13px; color:#888; margin-top:-10px; min-height:24px;"></div>

        <!-- КНОПКИ ДЕЙСТВИЙ -->
        <div id="actionGroup">
            <button class="action-btn btn-mix" id="mixBtn">🌀 Смешать</button>
        </div>

        <!-- КНОПКИ ПОСЛЕ СМЕШИВАНИЯ (скрыты по умолчанию) -->
        <div id="postGroup" class="hidden">
            <div class="btn-group">
                <button class="action-btn btn-drink" id="drinkBtn">🍸 Выпить</button>
                <button class="action-btn btn-back" id="backBtn">↺ Назад</button>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТ -->
        <div id="result">выбери ингредиенты</div>
        <div class="note">🔞 нелегальные — только для исследования</div>
    </div>

    <script>
        // === ДАННЫЕ ===
        const INGREDIENTS = {
            "Текила": { color: "#D4A017", strength: 38 },
            "Ром": { color: "#B8860B", strength: 40 },
            "Водка": { color: "#F0F0F0", strength: 40 },
            "Джин": { color: "#E0FFFF", strength: 37 },
            "Абсент": { color: "#50C878", strength: 70 },
            "Ликер Блю Кюрасао": { color: "#1E90FF", strength: 20 },
            "Энергетик": { color: "#FFD700", strength: 0 },
            "Сироп Гренадин": { color: "#FF1493", strength: 0 },
            "Кока-Кола": { color: "#3B170B", strength: 0 },
            "Сок Лайма": { color: "#32CD32", strength: 0 },
            "Кетамин": { color: "#E6E6FA", strength: 0, illegal: true },
            "МДМА": { color: "#F5F5F5", strength: 0, illegal: true },
        };

        const REACTIONS = {
            "Божественно": { emoji: "✨", class: "good", desc: "Идеальный баланс! Эйфория." },
            "Приятно": { emoji: "😊", class: "good", desc: "Лёгкое удовольствие." },
            "Головокружение": { emoji: "🌀", class: "warning", desc: "Слегка шатает." },
            "Тошнота": { emoji: "🤢", class: "warning", desc: "Желудок протестует." },
            "Провал в памяти": { emoji: "💀", class: "danger", desc: "Отключка." },
            "Остановка дыхания": { emoji: "⚠️", class: "danger", desc: "Алкоголь + седативные." },
            "Сердечный приступ": { emoji: "💔", class: "danger", desc: "Кокаин + алкоголь." },
            "Серотониновый шторм": { emoji: "🔥", class: "danger", desc: "МДМА + энергетик." },
            "Кетаминовая яма": { emoji: "🕳️", class: "danger", desc: "Кетамин + абсент." },
            "Летальный исход": { emoji: "⚰️", class: "danger", desc: "Смертельная комбинация." }
        };

        // === СОСТОЯНИЕ ===
        let state = {
            mix: {}, // { "Текила": 250, "Ром": 250 }
            isShaking: false,
            isMixed: false,
        };

        // === DOM ===
        const flask = document.getElementById('flask');
        const liquid = document.getElementById('liquid');
        const label = document.getElementById('flaskLabel');
        const glow = document.getElementById('flaskGlow');
        const pourInfo = document.getElementById('pourInfo');
        const resultDiv = document.getElementById('result');
        const mixBtn = document.getElementById('mixBtn');
        const actionGroup = document.getElementById('actionGroup');
        const postGroup = document.getElementById('postGroup');
        const drinkBtn = document.getElementById('drinkBtn');
        const backBtn = document.getElementById('backBtn');

        const ingredientBtns = document.querySelectorAll('.ingredient-btn');

        // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
        function hexToRgb(hex) {
            const res = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return res ? { r: parseInt(res[1], 16), g: parseInt(res[2], 16), b: parseInt(res[3], 16) } : null;
        }

        function updateFlask() {
            const total = Object.values(state.mix).reduce((a, b) => a + b, 0);
            if (total === 0) {
                liquid.style.height = '0%';
                label.textContent = 'наливай';
                glow.classList.remove('active');
                pourInfo.textContent = '';
                return;
            }

            const level = Math.min(88, (total / 500) * 88);
            liquid.style.height = level + '%';
            glow.classList.add('active');

            // Смешиваем цвет
            let r = 0,
                g = 0,
                b = 0,
                w = 0;
            Object.keys(state.mix).forEach(name => {
                const v = state.mix[name];
                const col = INGREDIENTS[name].color;
                const rgb = hexToRgb(col);
                if (!rgb) return;
                r += rgb.r * v;
                g += rgb.g * v;
                b += rgb.b * v;
                w += v;
            });
            if (w > 0) {
                r = Math.min(255, Math.round(r / w));
                g = Math.min(255, Math.round(g / w));
                b = Math.min(255, Math.round(b / w));
                liquid.style.background = `rgb(${r},${g},${b})`;
            }

            const names = Object.keys(state.mix);
            pourInfo.textContent = names.join(' + ') + ` (${total} мл)`;
            label.textContent = `${total} мл`;
        }

        function getTotalStrength() {
            let total = 0,
                sum = 0;
            Object.keys(state.mix).forEach(k => {
                const v = state.mix[k];
                total += v;
                sum += INGREDIENTS[k].strength * v;
            });
            return total === 0 ? 0 : Math.round(sum / total);
        }

        function getIllegal() {
            return Object.keys(state.mix).filter(k => INGREDIENTS[k].illegal);
        }

        function resetState() {
            state.mix = {};
            state.isShaking = false;
            state.isMixed = false;
            flask.classList.remove('shaking');
            actionGroup.classList.remove('hidden');
            postGroup.classList.add('hidden');
            mixBtn.disabled = false;
            ingredientBtns.forEach(b => b.disabled = false);
            updateFlask();
            resultDiv.innerHTML = 'выбери ингредиенты';
        }

        // === НАЛИТЬ ИНГРЕДИЕНТ ===
        function pourIngredient(name) {
            if (state.isShaking || state.isMixed) return;
            if (Object.keys(state.mix).length >= 6) {
                resultDiv.innerHTML = '⚠️ Слишком много ингредиентов!';
                return;
            }
            // Каждый раз наливаем 250 мл (если уже есть — добавляем)
            if (state.mix[name]) {
                state.mix[name] += 250;
            } else {
                state.mix[name] = 250;
            }
            // Если больше 500 мл — обрезаем до 500
            if (state.mix[name] > 500) state.mix[name] = 500;
            updateFlask();
            resultDiv.innerHTML = `➕ ${name} +250 мл`;
        }

        // === СМЕШАТЬ (анимация 5 сек) ===
        function startMix() {
            const total = Object.values(state.mix).reduce((a, b) => a + b, 0);
            if (total === 0) {
                resultDiv.innerHTML = '❌ сначала налей что-нибудь';
                return;
            }
            if (Object.keys(state.mix).length < 2) {
                resultDiv.innerHTML = '❌ нужно минимум 2 ингредиента';
                return;
            }

            state.isShaking = true;
            state.isMixed = false;
            mixBtn.disabled = true;
            ingredientBtns.forEach(b => b.disabled = true);
            flask.classList.add('shaking');
            resultDiv.innerHTML = '🌀 Смешивание... 5 секунд';

            // Показываем анимацию 5 секунд
            setTimeout(() => {
                flask.classList.remove('shaking');
                state.isShaking = false;
                state.isMixed = true;
                actionGroup.classList.add('hidden');
                postGroup.classList.remove('hidden');
                resultDiv.innerHTML = '✅ Коктейль готов!';
                // Добавляем случайное свечение
                glow.classList.add('active');
            }, 5000);
        }

        // === ВЫПИТЬ (реакция) ===
        function drink() {
            const strength = getTotalStrength();
            const illegal = getIllegal();
            const names = Object.keys(state.mix);

            let key = "Приятно";
            if (names.includes("Кетамин") && names.includes("Абсент")) key = "Кетаминовая яма";
            else if (names.includes("МДМА") && names.includes("Энергетик")) key = "Серотониновый шторм";
            else if (illegal.length >= 2 && strength > 20) key = "Летальный исход";
            else if (strength > 50) key = "Провал в памяти";
            else if (strength > 35 && names.some(k => k.includes("сироп") || k.includes("Кола"))) key = "Головокружение";
            else if (strength < 12 && illegal.length === 0) key = "Божественно";
            else if (illegal.length) key = "Головокружение";
            else if (strength > 30) key = "Головокружение";

            const r = REACTIONS[key];
            let html = `${r.emoji} <span class="${r.class}"><strong>${key}</strong></span>\n\n📖 ${r.desc}`;
            if (illegal.length) {
                html += `\n\n🔞 Содержит нелегальные: ${illegal.join(', ')}`;
            }
            if (strength > 0) {
                html += `\n🍸 Крепость: ${strength}°`;
            }
            resultDiv.innerHTML = html;
            // После выпивания — сброс через 3 секунды
            setTimeout(() => {
                resetState();
            }, 4000);
        }

        // === НАЗАД ===
        function goBack() {
            resetState();
        }

        // === ПРИВЯЗКА СОБЫТИЙ ===
        ingredientBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const name = btn.dataset.ingredient;
                if (name) pourIngredient(name);
            });
        });

        mixBtn.addEventListener('click', startMix);
        drinkBtn.addEventListener('click', drink);
        backBtn.addEventListener('click', goBack);

        // === СТАРТ ===
        resetState();

        // Сообщаем Telegram, что приложение готово
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
        }
    </script>
</body>
</html>
